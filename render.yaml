services:
  - type: web
    name: voicerag
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('punkt_tab', quiet=True)"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SARVAM_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: FAISS_INDEX_PATH
        value: data/faiss_index
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-base
